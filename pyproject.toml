
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mergemind"
version = "0.1.0"
description = "Semantic merge conflict detection and resolution toolkit"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "networkx>=3.0"
]

[project.scripts]
mergemind = "mergemind.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
